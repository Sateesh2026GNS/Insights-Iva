# Staging load-balancer only — NOT production.
# Terminates HTTP on :80 and forwards to two FastAPI containers.
# Preserve Authorization and client IP for rate limiting / audit.

upstream insights_iva_api {
    server api1:8000 max_fails=2 fail_timeout=10s;
    server api2:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /health {
        proxy_pass http://insights_iva_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://insights_iva_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
