<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Card Form Controls Preview</title>
    <link rel="stylesheet" href="../../src/index.css" />
    <link rel="stylesheet" href="../../src/styles/manual-sales-job-card-form.css" />
  </head>
  <body class="manual-sjc-page">
    <div class="manual-sjc-form">
      <section class="manual-sjc__section manual-sjc__section--block">
        <div class="manual-sjc__primary-grid">
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Company Name *</label>
            <div class="manual-sjc__grid-control">
              <button type="button" class="ui-searchable-select manual-sjc__select">
                <span class="truncate text-[var(--color-text)]">Acme Manufacturing Pvt Ltd</span>
                <span class="flex shrink-0 items-center gap-0.5">
                  <svg class="h-[1.0625rem] w-[1.0625rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </button>
            </div>
          </div>
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Sales Order No. *</label>
            <div class="manual-sjc__grid-control">
              <button type="button" class="ui-searchable-select manual-sjc__select">
                <span class="truncate text-[var(--color-text-placeholder)]">Choose a sales order…</span>
                <span class="flex shrink-0 items-center gap-0.5">
                  <svg class="h-[1.0625rem] w-[1.0625rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </button>
            </div>
          </div>
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Job Card Date *</label>
            <div class="manual-sjc__grid-control">
              <div class="ui-date-compact relative flex w-full items-center">
                <span class="min-w-0 flex-1 truncate text-[var(--color-text)]">14 Oct 2026</span>
                <button type="button" class="relative z-10 mr-1 flex h-7 w-7 shrink-0 items-center justify-center rounded-md" aria-label="Open calendar">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Delivery Date</label>
            <div class="manual-sjc__grid-control">
              <div class="ui-date-compact relative flex w-full items-center">
                <span class="min-w-0 flex-1 truncate text-[var(--color-text-placeholder)]">Select date</span>
                <button type="button" class="relative z-10 mr-1 flex h-7 w-7 shrink-0 items-center justify-center rounded-md" aria-label="Open calendar">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Product Category</label>
            <div class="manual-sjc__grid-control">
              <button type="button" class="ui-searchable-select manual-sjc__select">
                <span class="truncate text-[var(--color-text)]">Finished Goods</span>
                <span class="flex shrink-0 items-center gap-0.5">
                  <svg class="h-[1.0625rem] w-[1.0625rem]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                </span>
              </button>
            </div>
          </div>
          <div class="manual-sjc__grid-field">
            <label class="manual-sjc__grid-label">Priority</label>
            <div class="manual-sjc__grid-control">
              <select class="ui-select sjc-doc__input">
                <option>Normal</option>
              </select>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
