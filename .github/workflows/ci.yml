name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          ALLOW_SQLITE_RUNTIME: "1"
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: development
          ALLOW_PUBLIC_REGISTRATION: "true"
        run: pytest -q --tb=short

  backend-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insights_user
          POSTGRES_PASSWORD: insights_dev
          POSTGRES_DB: insights_iva
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Alembic upgrade head (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://insights_user:insights_dev@localhost:5432/insights_iva
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: development
        run: alembic upgrade head

  backend-postgres-critical:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: insights_user
          POSTGRES_PASSWORD: insights_dev
          POSTGRES_DB: insights_iva
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Critical tests on PostgreSQL
        env:
          USE_POSTGRES_TESTS: "1"
          DATABASE_URL: postgresql+psycopg://insights_user:insights_dev@localhost:5432/insights_iva
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production-32chars
          ENVIRONMENT: development
          ALLOW_PUBLIC_REGISTRATION: "true"
          STORAGE_PROVIDER: local
          FILE_STORAGE_LOCAL_PATH: /tmp/insights_ci_uploads
        run: >
          pytest -q --tb=short
          tests/test_auth.py
          tests/test_auth_security_hardening.py
          tests/test_rbac.py
          tests/test_rbac_roles.py
          tests/test_tenant_isolation.py
          tests/test_tenant_isolation_security.py
          tests/test_ai_assistant_access.py
          tests/agent/test_shared_agent_access.py
          tests/agent/test_tool_scoping.py
          tests/test_concurrency_controls.py
          tests/test_payment_safety.py
          tests/test_sales_order_cancellation.py
          tests/test_stock_in_workflow.py
          tests/test_stock_return_workflow.py
          tests/test_operator_production_entry.py
          tests/test_hr_module.py
          tests/test_payroll_duplicate_protection.py
          tests/test_journal_entries_api.py
          tests/test_file_management.py
          tests/test_local_download_security.py
          tests/test_reports_registry.py
          tests/test_operator_deep_row_access.py
          tests/test_tenant_resources.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --run
