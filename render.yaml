# Insights IVA API — Render Blueprint aligned with the existing Docker production service.
#
# Service name and public hostname must stay:
#   insights-iva-api  →  https://insights-iva-api.onrender.com
#
# Production today is managed primarily via the Render Dashboard (Docker runtime).
# This file documents / can sync the same shape. Do NOT set generateValue on JWT_SECRET_KEY
# (that would rotate the secret and invalidate sessions).
#
# Secrets (DATABASE_URL, JWT, S3, SMTP password, Resend, OpenAI, Google OAuth) stay
# dashboard-managed: sync: false means "use existing / set in Dashboard", never commit values.
#
# Alembic: Dockerfile CMD runs `alembic upgrade heads` before Gunicorn.
# Do not also run Alembic in a Python buildCommand (this service is not native Python).

services:
  - type: web
    name: insights-iva-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Omit dockerCommand → use Dockerfile CMD:
    #   alembic upgrade heads && gunicorn ... -b 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production

      # Existing Postgres — preserve; never recreate from Blueprint.
      - key: DATABASE_URL
        sync: false

      # Preserve existing secret — do not use generateValue.
      - key: JWT_SECRET_KEY
        sync: false

      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # SPA origins (no trailing slash). Keep legacy Firebase *.web.app hosts until cutover confirmed.
      - key: CORS_ORIGINS
        value: "https://www.insightsiva.com,https://insightsiva.com,https://insights-734ee.web.app,https://insights-734ee.firebaseapp.com,https://insights-iva-api.onrender.com"

      # Cross-site Firebase / custom domain → Render API cookies.
      - key: AUTH_COOKIE_MODE
        value: cookie
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"

      - key: ALLOWED_HOSTS
        value: "insights-iva-api.onrender.com,*.onrender.com,www.insightsiva.com,insightsiva.com,insights-734ee.web.app,insights-734ee.firebaseapp.com"

      - key: FRONTEND_BASE_URL
        value: "https://insightsiva.com"

      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "45"
      - key: AI_ASSISTANT_ENABLED
        value: "true"
      - key: AGENT_WRITE_TOOLS_ENABLED
        value: "false"

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
